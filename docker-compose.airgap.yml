# Airgap demo: CockroachDB + Banko + Ollama, no external network needed at
# demo time. The first `up` while online pulls the LLM into the ollama-models
# volume automatically (ollama-init below); after that the stack works with
# the wifi off. scripts/airgap/preload-models.sh does the same thing
# explicitly if you would rather cache ahead of time.

services:
  cockroachdb:
    image: cockroachdb/cockroach:${COCKROACHDB_VERSION:-v25.4.13}
    container_name: banko-airgap-cockroachdb
    hostname: cockroachdb
    ports:
      - "26257:26257"
      - "8080:8080"
    command: start-single-node --insecure
    volumes:
      - cockroach-data:/cockroach/cockroach-data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health?ready=1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - banko-airgap

  ollama:
    image: ollama/ollama:${OLLAMA_VERSION:-latest}
    container_name: banko-airgap-ollama
    hostname: ollama
    ports:
      - "11434:11434"
    environment:
      # Backstop for anything that reaches the daemon without its own
      # options: an 8k context keeps granite3.3:8b well under the 10 GB
      # it takes at the 32k default, and 5m frees the memory when idle.
      - OLLAMA_CONTEXT_LENGTH=${OLLAMA_NUM_CTX:-8192}
      - OLLAMA_KEEP_ALIVE=${OLLAMA_KEEP_ALIVE:-5m}
    volumes:
      - ollama-models:/root/.ollama
    networks:
      - banko-airgap

  # One-shot preload: pulls the model into the shared volume only when it
  # is not already there. Online, the first `up` self-preloads; offline
  # with the model cached it exits clean without touching the network;
  # offline without the model it fails loudly instead of letting the app
  # come up brokenly.
  ollama-init:
    image: ollama/ollama:${OLLAMA_VERSION:-latest}
    container_name: banko-airgap-ollama-init
    depends_on:
      ollama:
        condition: service_started
    environment:
      - OLLAMA_HOST=http://ollama:11434
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        model="${OLLAMA_MODEL:-granite3.3:8b}"
        if ollama list | grep -q "$$model"; then
          echo "$$model already cached, nothing to pull"
        else
          echo "pulling $$model (first online run)"
          ollama pull "$$model"
        fi
    restart: "no"
    networks:
      - banko-airgap

  banko-ai:
    image: virag/banko-ai-assistant:${BANKO_VERSION:-latest}
    container_name: banko-airgap-app
    ports:
      - "5000:5000"
    depends_on:
      cockroachdb:
        condition: service_healthy
      ollama:
        condition: service_started
      ollama-init:
        condition: service_completed_successfully
    environment:
      - DATABASE_URL=cockroachdb://root@cockroachdb:26257/defaultdb?sslmode=disable
      # Demo default; set your own for anything beyond a local demo
      - SECRET_KEY=${SECRET_KEY:-local-demo-secret-change-me}
      - AI_SERVICE=ollama
      - OLLAMA_HOST=http://ollama:11434
      - OLLAMA_MODEL=${OLLAMA_MODEL:-granite3.3:8b}
      # Match the daemon above so the model loads once and stays loaded
      - OLLAMA_NUM_CTX=${OLLAMA_NUM_CTX:-8192}
      - OLLAMA_KEEP_ALIVE=${OLLAMA_KEEP_ALIVE:-5m}
      - CDC_WEBHOOK_HMAC_SECRET=${CDC_WEBHOOK_HMAC_SECRET:-airgap-demo-secret}
      - CACHE_SIMILARITY_THRESHOLD=${CACHE_SIMILARITY_THRESHOLD:-0.75}
      - CACHE_TTL_HOURS=${CACHE_TTL_HOURS:-24}
      # Never call out to Hugging Face; the model is baked into the image
      - HF_HUB_OFFLINE=1
      - TRANSFORMERS_OFFLINE=1
      - TOKENIZERS_PARALLELISM=false
    volumes:
      # Persistent embedding-model cache: preload-models.sh warms it while
      # online, so even an app image without the baked model works offline
      - hf-cache:/root/.cache/huggingface
    networks:
      - banko-airgap

volumes:
  cockroach-data:
  ollama-models:
  hf-cache:

networks:
  banko-airgap:
    driver: bridge
