{% extends "layout.html" %}
{% block title %}Cash flow{% endblock %}
{% block content %}
<section x-data="cashflowPage" x-init="load()">
  <div class="b-page-h"><h1>Cash flow</h1><div class="sp"></div>
    <template x-for="m in [3, 6, 12]" :key="m"><button type="button" class="b-f" :class="{ on: months === m }" @click="months = m; load()" x-text="m + ' months'"></button></template></div>
  <template x-if="error"><div class="b-card b-empty"><strong x-text="error"></strong></div></template>
  <div class="b-grid" x-show="data" x-cloak style="margin-top:14px">
    <div class="b-card b-s2"><div class="b-lbl">Income and spending</div><div style="height:220px;margin-top:8px"><canvas x-ref="flow"></canvas></div></div>
    <div class="b-card">
      <div class="b-lbl">Savings rate this month</div>
      <div class="b-big" x-text="current() && current().savings_rate !== null ? Banko.fmt.pct(current().savings_rate) : 'No income yet'"></div>
      <div class="b-muted" x-text="current() ? 'Net ' + Banko.fmt.money(current().net, { sign: true }) : ''"></div>
      <table class="b-table" style="margin-top:10px">
        <thead><tr><th>Month</th><th class="num">Net</th><th class="num">Rate</th></tr></thead>
        <tbody><template x-for="m in (data ? data.months.slice().reverse() : [])" :key="m.month">
          <tr><td x-text="Banko.fmt.month(m.month)"></td><td class="num" x-text="Banko.fmt.money0(m.net)"></td><td class="num" x-text="m.savings_rate === null ? '' : Banko.fmt.pct(m.savings_rate)"></td></tr>
        </template></tbody>
      </table>
    </div>
    <div class="b-card">
      <div class="b-lbl">Where it went</div>
      <div style="height:180px;margin-top:8px"><canvas x-ref="cats"></canvas></div>
    </div>
    <div class="b-card">
      <div class="b-lbl">By category</div>
      <template x-for="c in (data ? data.categories.slice(0, 8) : [])" :key="c.key">
        <div class="b-row" style="padding:5px 0;border-top:1px solid var(--bd2)"><span x-text="c.icon + ' ' + c.category"></span><span class="b-amt" x-text="Banko.fmt.money0(c.total)"></span></div>
      </template>
    </div>
    <div class="b-card">
      <div class="b-lbl">Top merchants</div>
      <template x-for="m in (data ? data.merchants : [])" :key="m.merchant">
        <div class="b-row" style="padding:5px 0;border-top:1px solid var(--bd2)"><span x-text="m.merchant + ' · ' + m.count + ' visits'"></span><span class="b-amt" x-text="Banko.fmt.money0(m.total)"></span></div>
      </template>
    </div>
  </div>
</section>
{% endblock %}
{% block page_scripts %}<script src="{{ url_for('static', filename='js/pages/cashflow.js') }}"></script>{% endblock %}
